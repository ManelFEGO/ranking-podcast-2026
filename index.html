<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Podcasts 2026">
  <meta name="description" content="Directorio personal de podcasts de marketing, negocio, SEO y tecnología.">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png">
  <link rel="stylesheet" href="./style.css">
  <title>Podcasts 2026</title>
</head>
<body>
  <header class="site-header" id="siteHeader">
    <div class="header-inner">
      <h1>Podcasts 2026</h1>
      <p class="count" aria-live="polite"><span id="totalCount">0</span> podcasts</p>
    </div>
  </header>

  <main class="container">
    <section class="controls" aria-label="Buscar y filtrar">
      <label class="search-box">
        <span class="sr-only">Buscar podcasts</span>
        <input id="searchInput" type="search" placeholder="Buscar por nombre o autor…" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
        <button id="clearSearch" class="icon-btn" type="button" aria-label="Borrar búsqueda" hidden>×</button>
      </label>

      <div class="filter-row">
        <label class="select-wrap">
          <span class="sr-only">Filtrar por plataforma</span>
          <select id="platformFilter">
            <option value="all">Todas las plataformas</option>
          </select>
        </label>

        <button id="favoritesToggle" class="toggle-btn" type="button" aria-pressed="false">
          <span aria-hidden="true">★</span>
          <span>Solo favoritos</span>
        </button>
      </div>
    </section>

    <p id="resultsMeta" class="results-meta" aria-live="polite"></p>
    <div id="podcastGrid" class="podcast-grid"></div>

    <section id="emptyState" class="empty-state" hidden>
      <p class="empty-icon" aria-hidden="true">⌕</p>
      <h2 id="emptyTitle">No hay resultados</h2>
      <p id="emptyText">Prueba con otro término o quita los filtros activos.</p>
      <button id="resetFilters" class="reset-btn" type="button">Limpiar filtros</button>
    </section>

    <noscript>
      <p class="noscript">Esta página necesita JavaScript para cargar el directorio.</p>
    </noscript>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>Copia local independiente</span>
      <span id="offlineStatus" aria-live="polite"></span>
    </div>
  </footer>

  <script src="./app.js" defer></script>
</body>
</html>
