    *{box-sizing:border-box}
    html{scroll-behavior:smooth}

    .item{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease}
    .item:hover{transform:translateY(-1px);border-color:#d1d5db;box-shadow:0 3px 12px rgba(0,0,0,.05)}
    .num{flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:var(--accent2);display:grid;place-items:center;font-size:.78rem;font-weight:700;color:#374151}
    .txt{min-width:0}
    .name{display:block;font-weight:650;font-size:.95rem;line-height:1.2}
    .author{display:block;color:var(--muted);font-size:.78rem;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .arrow{margin-left:auto;color:#9ca3af;font-size:1.1rem}
    .cta{display:flex;justify-content:center;padding:24px 0 10px}
    .vote{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 24px;background:#111827;color:#fff;border-radius:14px;text-decoration:none;font-weight:750;box-shadow:0 5px 18px rgba(17,24,39,.18)}
    .vote:hover{background:#000}
    .empty{display:none;text-align:center;color:var(--muted);padding:32px 8px}
    footer{text-align:center;color:#9ca3af;font-size:.78rem;padding-top:26px}
    @media (max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding-left:14px;padding-right:14px}.item{padding:14px 13px}.name{font-size:.98rem}.author{font-size:.8rem}}

const list = document.getElementById('list');
const search = document.getElementById('search');
const count = document.getElementById('count');
const empty = document.getElementById('empty');

function render(filter='') {
  const f = filter.trim().toLocaleLowerCase('es');
  const filtered = podcasts.filter(([name, author]) => `${name} ${author}`.toLocaleLowerCase('es').includes(f));
  list.innerHTML = filtered.map(([name, author, url], i) => {
    const number = String(podcasts.indexOf(podcasts.find(p => p[0]===name))+1).padStart(2,'0');
    return `<a class="item" href="${url}" target="_blank" rel="noopener noreferrer" aria-label="Abrir ${name}">
      <span class="num">${number}</span>
      <span class="txt"><span class="name">${escapeHtml(name)}</span><span class="author">${escapeHtml(author)}</span></span>
      <span class="arrow" aria-hidden="true">›</span>
    </a>`;
  }).join('');
  count.textContent = f ? `${filtered.length} candidatura${filtered.length===1?'':'s'} encontrada${filtered.length===1?'':'s'}` : `${podcasts.length} candidaturas`;
  empty.style.display = filtered.length ? 'none' : 'block';
}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
search.addEventListener('input', e => render(e.target.value));
render();

</script>
